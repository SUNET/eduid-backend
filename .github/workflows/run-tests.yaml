# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on: [push, pull_request]

env:
  UV_DEFAULT_INDEX: https://pypi.sunet.se/simple

jobs:

  unittests:
    runs-on: ubuntu-latest
    env:
      NEO4J_VERSION: 4.4-enterprise

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python from pyproject.toml
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: "pip"
          cache-dependency-path: |
            requirements/*main.txt
            requirements/*requirements.txt

      - name: Install packages
        run: |
          sudo apt update
          . .github/repo-system-packages.sh
          sudo apt install -y $repo_system_packages

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          make bootstrap VENV=.venv

      - name: Fetch docker images
        run: |
          docker pull docker.sunet.se/eduid/redis:latest
          docker pull docker.sunet.se/eduid/mongodb:latest
          docker pull docker.sunet.se/eduid/smtpdfix:latest
          docker pull neo4j:$NEO4J_VERSION

      - name: Test with pytest
        run: |
          . .venv/bin/activate
          make test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python from pyproject.toml
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: "pip"
          cache-dependency-path: |
            requirements/*main.txt
            requirements/*requirements.txt

      - name: Install packages
        run: |
          sudo apt update
          . .github/repo-system-packages.sh
          sudo apt install -y $repo_system_packages

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          make bootstrap VENV=.venv

      - name: Run mypy to check types
        run: |
          . .venv/bin/activate
          mypy --version
          make typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Lint using ruff"
        uses: astral-sh/ruff-action@v3
        with:
          version: "<0.16.0"

