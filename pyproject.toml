[project]
name = "eduid-backend"
dynamic = ["version"]
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
  "Babel",
  "Pillow",
  "PyNaCl",
  "PyYAML",
  "aiosmtplib",
  "bleach",
  "boto3",
  "celery[redis]",
  "cookies-samesite-compat",
  "cryptography",
  "email-validator",
  "fido2",
  "fido_mds",
  "gunicorn",
  "hammock",
  "html5lib",
  "httpx",
  "idna",
  "iso3166",
  "jwcrypto",
  "langcodes",
  "marshmallow",
  "marshmallow-dataclass",
  "marshmallow-enum",
  "motor",
  "neo4j",
  "oic",
  "phonenumbers",
  "proquint",
  "pwgen",
  "py-bcrypt",
  "pyOpenSSL",
  "pyXMLSecurity[PKCS11]",
  "pydantic",
  "pymongo",
  "pysaml2==7.5.2+sunet4",
  "pysmscom",
  "python-dateutil",
  "python-jose",
  "qrcode",
  "redis",
  "statsd",
  "suds-community",
  "xhtml2pdf",
  "zxcvbn",
]

[project.optional-dependencies]
webapp = [
  "Flask",
  "Flask-Mail",
  "authlib",
  "captcha",
  "flask-babel",
  "flask-cors",
  "sentry-sdk[flask]",
  "user-agents",
]
worker = ["jinja2"]
fastapi = [
  "apscheduler<4", # Next major version has API breaking changes
  "deepdiff",
  "fastapi",
  "hsmkey",
  "loguru",
  "ndnkdf",
  "pyhsm @ https://github.com/SUNET/python-pyhsm/archive/3b867ec8e0aa2c4444e9c84444228e95fc6aaabf.zip",
  "python-multipart", # needed to parse form data
  "uvicorn[standard]",
]
satosa-scim = ["SATOSA"]

[dependency-groups]
test = [
  "mypy",
  "pip-tools",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mock",
  "pytest-xdist",
  "respx",
  "uv",
  "celery-types",
  "motor-types",
  "statsd-stubs",
  "ruff",
]

[tool.ruff]
line-length = 120 # Set the maximum line length to 120.
target-version = "py313"

[tool.ruff.lint]
# extend-select rather than select, so we keep ruff's default rule set on top of
# the prefixes below. Every prefix here is still listed explicitly: the defaults
# only ever enable a subset of a linter, and defaults may also be removed
# upstream, so we do not rely on them to carry the rules we care about.
# See: https://docs.astral.sh/ruff/default-rules/
extend-select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FAST",
  "FLY",
  "FURB",
  "I",
  "ISC",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "RUF",
  "S101",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "PLR09", # rule set for complexity checks
  "PLC0415", # non top level imports
  # SIM102 and SIM103 are part of ruff's default rule set - these entries are a
  # deliberate opt-out, not leftovers from the pre-extend-select config
  "SIM102", # collapsible-if
  "SIM103", # return-bool-condition-directly (keeping explicit if/else for clarity)
  "SIM108", # if-else-block-instead-of-if-exp
  # Since we use ruff as a formatter, the following rules should be ignored.
  # Most are not enabled by our extend-select or by ruff's defaults today; they
  # are listed defensively so they cannot start conflicting with the formatter if
  # they are added to the default rule set later.
  # See: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191",
  "E111",
  "E114",
  "E117",
  "E501",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "COM812",
  "COM819",
  "ISC002",
  # TRANSIENT: rules from ruff's default rule set that we now inherit via
  # extend-select and that currently trigger. Ignored only to keep the tree green
  # while we work through them. Each one gets evaluated and then leaves this
  # block: fixed and deleted where that is easy, or moved up to the permanent
  # ignores above with a rationale where we decide to keep ignoring it. This
  # block is expected to be empty again in the near future - nothing should
  # linger here. Hit counts as of ruff 0.16.3.
  "BLE001", # blind-except (28)
  "D419", # empty-docstring (32)
  "G201", # logging-exc-info - .exception() instead of .error(..., exc_info=True) (5)
  "LOG015", # root-logger-call (6)
  "N999", # invalid-module-name - would mean renaming test modules (3)
  "PYI019", # custom-type-var-for-self - autofixable to Self (2)
  "PYI061", # redundant-none-literal (1)
  "RET501", # unnecessary-return-none (33)
  "TRY004", # type-check-without-type-error (51)
  "TRY201", # verbose-raise (16)
  "TRY401", # verbose-log-message (3)
]
allowed-confusables = ["’", "х"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-third-party = ["marshmallow_enum"]
section-order = ["future", "standard-library", "third-party", "eduid", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
eduid = ["ndnkdf"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR2004"] # magic-value-comparison - allow magic numbers in tests
"**/test*.py" = [
  "SIM117", # multiple-with-statements - combined session_transaction() calls break tests
  "S101" # assert - assert statements are used in tests
  ] 
# "src/eduid/scimapi/**" = ["A001", "A002"] # builtin shadowing - filter is core concept of scim and builtin is not used
"src/eduid/webapp/common/authn/vccs.py" = ["PLR2004"] # magic-value-comparison - allow magic numbers for password version

[tool.mypy]
plugins = ["pydantic.mypy", "marshmallow_dataclass.mypy"]
namespace_packages = true
pretty = true

[[tool.mypy.overrides]]
module = ["ndnkdf.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["fido_mds.*"]
follow_untyped_imports = true

# No stubs available, too many import sites to pin individually
[[tool.mypy.overrides]]
module = ["saml2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["satosa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
python_classes = ["Test*", "*Test", "*Tests"]
norecursedirs = ["cookiecutter-app", ".worktrees", ".claude"]
filterwarnings = [
  "ignore::DeprecationWarning:saml2.*",
  "ignore:The SAML service provider accepts unsigned:UserWarning:saml2.*",
]

[tool.coverage.run]
branch = true
source = ["eduid"]

[tool.coverage.report]
exclude_lines = [
  "if self.debug:",
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
ignore_errors = true
omit = ["tests/*"]

# Trying out new typechecker 'ty' via 'uvx ty check' i.e. not installing
[tool.ty.environment]
python-version = "3.13"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"